{{- if .Values.createNamespaces }}
# Namespaces and their Pod Security Admission labels.
# gshare-sessions enforces `baseline` and audits/warns at `restricted` (see the comment on that
# namespace: a policy-granted privileged session runs as root, which restricted rejects);
# gshare-infra is `privileged`, for the privileged DaemonSets only.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespaces.system }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespaces.sessions }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
    # Enforce baseline (audit and warn at restricted): every ordinary session pod still carries the
    # restricted shape (non-root, no escalation, all capabilities dropped), and the one relaxation
    # — a policy-granted privileged session running as root — is exactly what baseline admits
    # and restricted would reject. Host namespaces, privileged mode and host paths stay rejected.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    gshare.io/tenant-namespace: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespaces.infra }}
  labels:
    {{- include "gshare.labels" . | nindent 4 }}
    # An exception for the privileged DaemonSets (node-problem-detector, Spegel, the image
    # pre-puller). This is not a tenant namespace.
    pod-security.kubernetes.io/enforce: privileged
    gshare.io/infra: "true"
{{- end }}
