name: Publish session images

# The session catalogue images (build/images) are large and change rarely, so they are published
# on demand and on release tags — not on every push to main. The control plane seeds
# boanlab/gshare-session:<tag> references at startup (app/auth/bootstrap.py), so every tag the
# seed names must exist here or a fresh install offers images that cannot be pulled.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: Build only this tag (empty = all)
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: docker.io
  NAMESPACE: boanlab

jobs:
  publish:
    name: gshare-session:${{ matrix.tag }}
    runs-on: ubuntu-latest
    if: github.repository == 'boanlab/gShare'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: ml-ubuntu24.04,              dockerfile: build/images/ml/Dockerfile.cpu }
          - { tag: ml-cuda12.4-cudnn9,          dockerfile: build/images/ml/Dockerfile.ml-gpu }
          - { tag: pytorch2.6-cuda12.4-cudnn9,  dockerfile: build/images/ml/Dockerfile.pytorch-gpu }
          - { tag: tensorflow2.18-cuda12.5-cudnn9, dockerfile: build/images/ml/Dockerfile.tensorflow-gpu }
          - { tag: ml-cuda12.8-cudnn9,          dockerfile: build/images/ml/Dockerfile.ml-cu128 }
          - { tag: pytorch2.7-cuda12.8-cudnn9,  dockerfile: build/images/ml/Dockerfile.pytorch-blackwell }
          - { tag: pytorch2.8-cuda12.9-cudnn9,  dockerfile: build/images/ml/Dockerfile.pytorch28 }
          - { tag: tensorflow-ngc25.02-cuda12.8, dockerfile: build/images/ml/Dockerfile.tensorflow-ngc }
    steps:
      - uses: actions/checkout@v7
        if: inputs.only == '' || inputs.only == matrix.tag
      # CUDA images run to 10-15 GB; the hosted runner needs its spare disk back first.
      - name: Free runner disk
        if: inputs.only == '' || inputs.only == matrix.tag
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v4
        if: inputs.only == '' || inputs.only == matrix.tag
      - uses: docker/login-action@v4
        if: inputs.only == '' || inputs.only == matrix.tag
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: inputs.only == '' || inputs.only == matrix.tag
        with:
          context: build/images
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gshare-session:${{ matrix.tag }}
          cache-from: type=gha,scope=session-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=session-${{ matrix.tag }}
